services:
  hoton-graphtr:
    image: hoton-graphtr:${IMAGE_TAG:-latest}
    ports:
      # Host side configurable via RAG_PORT; container side stays 8030 to match
      # the Dockerfile's hardcoded `uvicorn --port 8030` CMD.
      - "${RAG_PORT:-8030}:8030"
    environment:
      QDRANT_URL: http://qdrant:6333
      USAGE_DB_HOST: postgres
      USAGE_DB_PORT: 5432
      USAGE_DB_USER: lmr
      USAGE_DB_PASSWORD: ${USAGE_DB_PASSWORD:?set USAGE_DB_PASSWORD in .env — no weak default}
      USAGE_DB_NAME: hoton_rag
      DASHBOARD_USER: ${DASHBOARD_USER:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      RAG_PORT: 8030
      EMBED_MODEL_NAME: ${RAG_EMBED_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      EMBED_DIM: ${RAG_EMBED_DIM:-384}
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - ${MODELS_DIR:-./models}/huggingface:/root/.cache/huggingface
      - ${CODE_REPOS_DIR_HOST:-./code-repos}:/data/code-repos
    depends_on:
      qdrant:
        condition: service_started
      # postgres:
      #   condition: service_healthy
    networks:
      - default
      - hoton-net

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: lmr
  #     POSTGRES_PASSWORD: ${USAGE_DB_PASSWORD:?set USAGE_DB_PASSWORD in .env — no weak default}
  #     POSTGRES_DB: hoton_rag
  #   ports:
  #     - "127.0.0.1:5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U lmr"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10

volumes:
  qdrant_data:
  postgres_data:

networks:
  hoton-net:
    external: true
